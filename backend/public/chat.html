<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Sire Printing</title>
    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body>
    <div class="pb" id="pb-root">
      <header class="pb-header">
        <div class="pb-header-text">
          <strong id="pb-title">Sire Printing</strong>
          <span class="pb-status"><i></i> online</span>
        </div>
        <button id="pb-quote" class="pb-icon-btn" title="Request a callback" aria-label="Request a callback">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg>
        </button>
        <button id="pb-call" class="pb-icon-btn" title="Start voice call" aria-label="Start voice call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <button id="pb-mute" class="pb-icon-btn" title="Mute voice" aria-label="Mute voice">
          <svg class="pb-i-unmuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
          <svg class="pb-i-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
        </button>
        <button id="pb-close" class="pb-icon-btn" title="Close" aria-label="Close chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <div class="pb-stage">
        <div class="pb-avatar-ring">
          <div id="pb-avatar" class="pb-avatar">
            <div class="pb-avatar-frame">
              <!-- Agent photo (AI-generated face), lip-synced to the voice by talking-head.js -->
              <canvas id="pb-avatar-canvas" role="img" aria-label="Zack, Sire Printing customer service"></canvas>
            </div>

            <span id="pb-avatar-badge" class="pb-avatar-badge" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/></svg>
            </span>
          </div>
          <span class="pb-avatar-shadow" aria-hidden="true"></span>
        </div>
        <p id="pb-caption" class="pb-caption"></p>
      </div>

      <div id="pb-messages" class="pb-messages" aria-live="polite"></div>

      <div id="pb-error" class="pb-error" hidden></div>

      <form id="pb-form" class="pb-input">
        <button type="button" id="pb-mic" class="pb-mic" title="Hold to talk" aria-label="Speak">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></svg>
        </button>
        <textarea id="pb-text" rows="1" placeholder="Type your message..." autocomplete="off"></textarea>
        <button type="submit" id="pb-send" class="pb-send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
      <div class="pb-foot">Powered by Sire Printing</div>

      <!-- Voice call overlay -->
      <div id="pb-call-ui" class="pb-call-ui" hidden>
        <div class="pb-call-inner">
          <p id="pb-call-status" class="pb-call-status">Connecting…</p>
          <p id="pb-call-live" class="pb-call-live"></p>
        </div>
        <div class="pb-call-actions">
          <button id="pb-call-mute" class="pb-round" title="Mute assistant" aria-label="Mute assistant">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
          </button>
          <button id="pb-call-end" class="pb-round pb-round-end" title="End call" aria-label="End call">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-1.78 1.61c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28a11.27 11.27 0 0 0-2.66-1.85.998.998 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
          </button>
        </div>
      </div>

      <!-- Lead / callback form overlay -->
      <div id="pb-lead" class="pb-lead" hidden>
        <div class="pb-lead-card">
          <button id="pb-lead-x" class="pb-lead-x" aria-label="Close form">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
          <h3>Request a callback</h3>
          <p>Leave your details and a Sire Printing rep will get back to you.</p>
          <form id="pb-lead-form">
            <label>Name<span>*</span>
              <input name="name" type="text" required autocomplete="name" />
            </label>
            <label>Email
              <input name="email" type="email" autocomplete="email" placeholder="you@company.com" />
            </label>
            <label>Phone
              <input name="phone" type="tel" autocomplete="tel" placeholder="+92 300 0000000" />
            </label>
            <label>What do you need? (optional)
              <textarea name="message" rows="2" placeholder="e.g. 500 mailer boxes, 10x8x3 in, printed"></textarea>
            </label>
            <p class="pb-lead-hint">Provide at least an email or a phone number.</p>
            <div id="pb-lead-err" class="pb-lead-err" hidden></div>
            <button type="submit" id="pb-lead-submit">Send request</button>
          </form>
          <div id="pb-lead-done" class="pb-lead-done" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            <p>Thanks! We'll be in touch shortly.</p>
          </div>
        </div>
      </div>

    </div>

    <script src="/talking-head.js"></script>
    <script src="/chat.js"></script>
  </body>
</html>
